name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          mkdir source
          unzip -q MaakiAuto.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/source" -name settings.gradle.kts -print -quit)")
          echo "Project directory: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maaki-apk
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
